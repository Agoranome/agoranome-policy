name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: |
          python -m pip install --upgrade pip pytest
          PYTHONPATH=src python -m pytest -q tests
      - name: Wheel builds the same twice
        run: |
          python build_wheel.py a > a.txt
          python build_wheel.py b > b.txt
          cmp a.txt b.txt
          cat a.txt
