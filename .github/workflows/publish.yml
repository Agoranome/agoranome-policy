# Publishes agoranome-policy to PyPI through a trusted publisher (OIDC), so no
# token is ever created or stored. Run it by hand from Actions → Publish to PyPI.
#
# The wheel is built by build_wheel.py and must match, byte for byte, the wheel
# agoranome.com/policy serves, so pip from PyPI and pip from the site install
# the same file. Bump __version__ (and pyproject.toml) to release a new version.
name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: |
          python -m pip install --upgrade pip pytest build
          PYTHONPATH=src python -m pytest -q tests

      - name: Build
        run: |
          python build_wheel.py dist > wheel.txt
          read wheel sha < wheel.txt
          declared=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          case "$wheel" in
            agoranome_policy-$declared-*) ;;
            *) echo "::error::pyproject.toml says $declared but the package says $wheel"; exit 1 ;;
          esac
          python -m build --sdist --outdir dist .
          echo "Built $wheel ($sha)"
          ls -l dist

      - name: Match the wheel agoranome.com serves
        run: |
          read wheel sha < wheel.txt
          served=$(curl -fsSL -A "agoranome-policy-release" "https://agoranome.com/policy/$wheel" | sha256sum | cut -d' ' -f1)
          if [ "$served" != "$sha" ]; then
            echo "::error::agoranome.com serves a different $wheel ($served, built $sha). Deploy this version to the site first."
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
